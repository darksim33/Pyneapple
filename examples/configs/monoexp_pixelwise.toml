# Mono-exponential pixelwise fitting configuration
#
# Usage:
#   pyneapple-pixelwise \
#       --image  dwi.nii.gz \
#       --bval   dwi.bval   \
#       --config monoexp_pixelwise.toml \
#       --seg    mask.nii.gz
#
# Fits S(b) = S0 * exp(-b * D) independently at every voxel.
# Use this as a baseline ADC map before moving to multi-exponential models.

[Fitting]
fitter = "pixelwise"

[Fitting.model]
type = "monoexp"

[Fitting.solver]
type     = "curvefit"
max_iter = 250
tol      = 1e-8

# p0: initial parameter guesses handed to the optimizer.
[Fitting.solver.p0]
S0 = 1000.0   # signal at b = 0  [a.u.]
D  = 0.001    # apparent diffusion coefficient  [mm²/s]

# bounds: [lower, upper] hard constraints for each parameter.
[Fitting.solver.bounds]
S0 = [1.0,  5000.0]
D  = [1e-5, 0.1]
